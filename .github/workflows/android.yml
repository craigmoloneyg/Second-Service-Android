name: Build Android APK
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test, lint, and build debug APK
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Name APK and record checksum
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Second-Service-debug.apk
          cd dist
          sha256sum Second-Service-debug.apk > SHA256SUMS.txt
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Second-Service-debug-APK
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-validation-reports
          path: app/build/reports/
          retention-days: 14
